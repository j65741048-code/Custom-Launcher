          package com.titania.loader;

          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.math.Axis;
          import net.minecraft.Util;
          import net.minecraft.client.gui.GuiGraphics;

          /**
           * Looping 2D side-view animation: three lanes of ships, each cycling through
           * sailing in, floating, sinking completely, and leaving bubbles and debris.
           * Everything is drawn with flat, blocky "textured" rectangles.
           */
          public final class SeaBackground {
              private SeaBackground() {}

              private static final float T = 36f; // seconds per ship cycle
              private static final float[] OFFSET = {0f, 12f, 24f};
              private static final float[] LANE_Y = {0.50f, 0.61f, 0.74f};
              private static final float[] LANE_X = {0.27f, 0.70f, 0.46f};
              private static final float[] LANE_DIV = {70f, 52f, 40f};
              private static final int[] WATER = {0xF0081F45, 0xF00B2E5E, 0xF00F3F7A};
              private static final int[] WAVE = {0xFF1B4A8A, 0xFF2563A3, 0xFF3A84C4};

              public static void draw(GuiGraphics g, int w, int h) {
                  float time = Util.getMillis() / 1000f;
                  g.fillGradient(0, 0, w, h, 0xFF050B22, 0xFF1E3A6B);
                  for (int i = 0; i < 60; i++) {
                      int x = (i * 7919) % Math.max(1, w);
                      int y = (i * 104729) % Math.max(1, (int) (h * 0.45f));
                      int a = 120 + (int) (135 * (0.5 + 0.5 * Math.sin(time * 1.5 + i)));
                      g.fill(x, y, x + 2, y + 2, (a << 24) | 0xFFFFFF);
                  }
                  int moon = Math.max(10, h / 14);
                  int mx = (int) (w * 0.84f);
                  int my = (int) (h * 0.12f);
                  g.fill(mx, my, mx + moon, my + moon, 0xFFF4F1DE);
                  for (int lane = 0; lane < 3; lane++) lane(g, w, h, lane, time);
              }

              private static void lane(GuiGraphics g, int w, int h, int lane, float time) {
                  int y = (int) (h * LANE_Y[lane]);
                  int u = Math.max(2, (int) (h / LANE_DIV[lane]));
                  float local = time + OFFSET[lane];
                  int cycle = (int) Math.floor(local / T);
                  float s = local - cycle * T;
                  int kind = Math.floorMod(cycle + lane, 4);
                  int face = ((cycle + lane) % 2 == 0) ? 1 : -1;
                  int bowDown = (kind == 1 || kind == 3) ? -1 : 1;

                  float e = Math.min(1f, s / 6f);
                  e = e * e * (3 - 2 * e);
                  float baseX = w * LANE_X[lane];
                  float x = baseX - face * w * 0.8f * (1 - e);
                  float q = Math.max(0f, Math.min(1f, (s - 10f) / 16f));
                  float bob = (float) Math.sin(time * 1.7 + lane) * u * 0.4f;
                  float tilt = Math.min(1f, q * 1.6f) * (kind == 0 ? 78f : 62f);
                  float depth = q * q * u * 70f;

                  if (s < 28f) {
                      PoseStack ps = g.pose();
                      ps.pushPose();
                      ps.translate(x + face * q * u * 8f, y - u * 2f + bob * (1f - q) + depth, 0f);
                      ps.mulPose(Axis.ZP.rotationDegrees(face * bowDown * tilt));
                      ps.scale(face, 1f, 1f);
                      ship(g, kind, u, lane * 7 + cycle);
                      ps.popPose();
                  }

                  // water layer hides whatever has sunk below this lane's surface
                  g.fill(0, y, w, h, WATER[lane]);
                  long ms = Util.getMillis();
                  for (int wx = 0; wx < w; wx += u * 2) {
                      int wy = y + (int) (Math.sin((wx + ms / 7.0 + lane * 90) / (u * 3.0)) * u * 0.5);
                      g.fill(wx, wy, wx + u * 2, wy + Math.max(1, u / 2), WAVE[lane]);
                  }

                  float endX = baseX + face * u * 8f;
                  if (s > 12f && s < 26f) { // bubbles
                      int size = Math.max(2, u / 2);
                      for (int i = 0; i < 12; i++) {
                          int bx = (int) (endX + ((i * 37) % (u * 20)) - u * 10);
                          int by = y + u * 12 - (int) (((s * 8f + i * 13) % 12f) * u);
                          g.fill(bx, by, bx + size, by + size, 0x90FFFFFF);
                      }
                  }
                  if (s > 14f && s < 33f) { // floating debris
                      int a = (int) (255 * Math.min(1f, (33f - s) / 4f));
                      for (int i = 0; i < 6; i++) {
                          int dx = (i - 3) * u * 4 + (int) (Math.sin(time * 0.8 + i) * u)
                                  + (int) ((s - 14f) * u * 0.3f * (i % 2 == 0 ? 1 : -1));
                          int px = (int) endX + dx;
                          g.fill(px, y - u / 2, px + u * 2, y, (a << 24) | 0x7A5230);
                      }
                  }
              }

              private static void ship(GuiGraphics g, int kind, int u, int seed) {
                  switch (kind) {
                      case 0 -> liner(g, u, seed);
                      case 1 -> galleon(g, u, seed);
                      case 2 -> freighter(g, u, seed);
                      default -> trawler(g, u, seed);
                  }
              }

              private static void liner(GuiGraphics g, int u, int seed) {
                  block(g, -20 * u, -3 * u, 20 * u, u, 0xFF1A1A1A, u, seed);
                  block(g, -20 * u, u, 19 * u, 2 * u, 0xFF9E1B1B, u, seed + 1);
                  g.fill(20 * u, -3 * u, 21 * u, 0, 0xFF1A1A1A);
                  g.fill(21 * u, -3 * u, 22 * u, -2 * u, 0xFF1A1A1A);
                  block(g, -16 * u, -6 * u, 14 * u, -3 * u, 0xFFEDEDED, u, seed + 2);
                  block(g, -12 * u, -8 * u, 8 * u, -6 * u, 0xFFEDEDED, u, seed + 3);
                  for (int x = -15; x < 13; x += 2) g.fill(x * u, -5 * u, x * u + u, -4 * u, 0xFFFFE08A);
                  for (int k = 0; k < 4; k++) {
                      int x = (-9 + k * 5) * u;
                      block(g, x, -13 * u, x + 3 * u, -8 * u, 0xFFD9A441, u, seed + 4 + k);
                      g.fill(x, -13 * u, x + 3 * u, -12 * u, 0xFF141414);
                  }
                  g.fill(15 * u, -11 * u, 16 * u, -3 * u, 0xFF555555);
              }

              private static void galleon(GuiGraphics g, int u, int seed) {
                  block(g, -14 * u, -3 * u, 14 * u, 2 * u, 0xFF6B4423, u, seed);
                  block(g, -14 * u, -6 * u, -8 * u, -3 * u, 0xFF7A5230, u, seed + 1);
                  g.fill(14 * u, -3 * u, 18 * u, -2 * u, 0xFF4A2F18);
                  block(g, -9 * u, -19 * u, 0, -8 * u, 0xFFE8DFC0, u, seed + 2);
                  block(g, u, -17 * u, 9 * u, -8 * u, 0xFFE8DFC0, u, seed + 3);
                  g.fill(-4 * u, -21 * u, -3 * u, -3 * u, 0xFF3B2512);
                  g.fill(5 * u, -19 * u, 6 * u, -3 * u, 0xFF3B2512);
                  g.fill(-4 * u, -23 * u, -1 * u, -21 * u, 0xFFB22222);
                  for (int x = -12; x < 12; x += 3) g.fill(x * u, -1 * u, x * u + u, 0, 0xFF1E1208); // gun ports
              }

              private static void freighter(GuiGraphics g, int u, int seed) {
                  block(g, -22 * u, -3 * u, 22 * u, 2 * u, 0xFF2C4A3A, u, seed);
                  block(g, -22 * u, u, 21 * u, 2 * u, 0xFF7B2A2A, u, seed + 1);
                  g.fill(22 * u, -3 * u, 23 * u, 0, 0xFF2C4A3A);
                  block(g, -20 * u, -9 * u, -12 * u, -3 * u, 0xFFEFEFEF, u, seed + 2);
                  g.fill(-19 * u, -7 * u, -13 * u, -6 * u, 0xFF2A3F5F);
                  g.fill(-17 * u, -12 * u, -14 * u, -9 * u, 0xFFC23B22);
                  int[] cols = {0xFFC0392B, 0xFF2980B9, 0xFFD68910, 0xFF27AE60};
                  for (int i = 0; i < 6; i++) {
                      int x = (-10 + i * 5) * u;
                      block(g, x, -6 * u, x + 4 * u, -3 * u, cols[i % 4], u, seed + 3 + i);
                      if (i < 4) block(g, x, -9 * u, x + 4 * u, -6 * u, cols[(i + 2) % 4], u, seed + 9 + i);
                  }
              }

              private static void trawler(GuiGraphics g, int u, int seed) {
                  block(g, -10 * u, -2 * u, 10 * u, 2 * u, 0xFF2F5D8A, u, seed);
                  g.fill(10 * u, -2 * u, 11 * u, 0, 0xFF2F5D8A);
                  block(g, -6 * u, -6 * u, 0, -2 * u, 0xFFF2F2F2, u, seed + 1);
                  g.fill(-5 * u, -5 * u, -1 * u, -4 * u, 0xFF223344);
                  g.fill(3 * u, -10 * u, 4 * u, -2 * u, 0xFF555555);
                  g.fill(3 * u, -9 * u, 9 * u, -8 * u, 0xFF555555);
              }

              /** Fills a rectangle as a grid of slightly varied cells so flat colours look like blocky textures. */
              private static void block(GuiGraphics g, int x0, int y0, int x1, int y1, int color, int u, int seed) {
                  for (int y = y0; y < y1; y += u) {
                      for (int x = x0; x < x1; x += u) {
                          int hsh = (Math.floorDiv(x, u) * 73856093) ^ (Math.floorDiv(y, u) * 19349663) ^ (seed * 83492791);
                          int d = (((hsh >>> 8) & 15) - 8) * 2;
                          g.fill(x, y, Math.min(x + u, x1), Math.min(y + u, y1), shade(color, d));
