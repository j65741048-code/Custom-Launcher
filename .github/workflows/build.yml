name: Build Titania's Mod Loader

# Put this file at .github/workflows/build.yml in an empty repo.
# It generates the whole project, builds it, downloads the compatibility +
# performance mods, and uploads a ready-to-use instance zip as an artifact.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------
      # 1. Generate the project (Minecraft 1.21.1 on NeoForge)
      # ------------------------------------------------------------------
      - name: Generate project files
        run: |
          mkdir -p src/main/java/com/titania/loader
          mkdir -p src/main/resources/META-INF
          mkdir -p src/main/resources/assets/titanias_loader

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.neoforged.net/releases' }
              }
          }
          rootProject.name = 'titanias_loader'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'net.neoforged.moddev' version '2.0.78'
          }
          version = '1.0.0'
          group = 'com.titania'
          base { archivesName = 'titanias-mod-loader' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(21)
          neoForge {
              version = '21.1.172'
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          EOF

          cat > src/main/resources/META-INF/neoforge.mods.toml <<'EOF'
          modLoader = "javafml"
          loaderVersion = "[1,)"
          license = "MIT"

          [[mods]]
          modId = "titanias_loader"
          version = "1.0.0"
          displayName = "Titania's Mod Loader"
          authors = "Titania"
          logoFile = "icon.png"
          description = '''
          A mod loader core that reads Fabric, Quilt, NeoForge, Forge and Titania mods into one list, and loads Fabric, Quilt and Titania mods itself. Titanic loading screen, intro, and a sinking-ships main menu.
          '''

          [[dependencies.titanias_loader]]
          modId = "neoforge"
          type = "required"
          versionRange = "[21.1,)"
          ordering = "NONE"
          side = "CLIENT"

          [[dependencies.titanias_loader]]
          modId = "minecraft"
          type = "required"
          versionRange = "[1.21.1,1.22)"
          ordering = "NONE"
          side = "CLIENT"
          EOF

          # ---- Icon (Titanic) -------------------------------------------
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          S = 128
          im = Image.new("RGBA", (S, S), (6, 14, 40, 255))
          d = ImageDraw.Draw(im)
          d.rectangle([0, 92, S, S], fill=(11, 58, 107, 255))            # sea
          d.rectangle([14, 72, 112, 88], fill=(20, 20, 20, 255))         # hull
          d.rectangle([112, 76, 118, 84], fill=(20, 20, 20, 255))        # bow
          d.rectangle([14, 86, 108, 90], fill=(158, 27, 27, 255))        # red band
          d.rectangle([24, 58, 100, 72], fill=(237, 237, 237, 255))      # decks
          d.rectangle([34, 48, 86, 58], fill=(237, 237, 237, 255))
          for i in range(4):                                             # funnels
              x = 38 + i * 15
              d.rectangle([x, 26, x + 9, 48], fill=(217, 164, 65, 255))
              d.rectangle([x, 26, x + 9, 30], fill=(20, 20, 20, 255))
          for x in range(28, 98, 6):                                     # windows
              d.rectangle([x, 63, x + 2, 66], fill=(255, 224, 138, 255))
          d.rectangle([100, 34, 102, 58], fill=(90, 90, 90, 255))        # mast
          im.save("src/main/resources/assets/titanias_loader/icon.png")
          im.save("src/main/resources/icon.png")
          PY

          # ---- Java: entry point ----------------------------------------
          cat > src/main/java/com/titania/loader/TitaniasLoader.java <<'EOF'
          package com.titania.loader;

          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.bus.api.IEventBus;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.fml.event.lifecycle.FMLCommonSetupEvent;

          @Mod(value = "titanias_loader", dist = Dist.CLIENT)
          public class TitaniasLoader {
              public TitaniasLoader(IEventBus modBus) {
                  TitaniaRuntime.discover();
                  modBus.addListener(FMLCommonSetupEvent.class, e -> e.enqueueWork(TitaniaRuntime::initialize));
              }
          }
          EOF

          # ---- Java: events (icon, loading screen swap, intro) ----------
          cat > src/main/java/com/titania/loader/ClientEvents.java <<'EOF'
          package com.titania.loader;

          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.screens.LoadingOverlay;
          import net.minecraft.client.gui.screens.TitleScreen;
          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.neoforge.client.event.ClientTickEvent;
          import net.neoforged.neoforge.client.event.ScreenEvent;

          @EventBusSubscriber(modid = "titanias_loader", value = Dist.CLIENT)
          public class ClientEvents {
              private static boolean iconSet = false;
              private static boolean introShown = false;
              private static boolean overlaySwapped = false;

              @SubscribeEvent
              public static void onTick(ClientTickEvent.Pre event) {
                  Minecraft mc = Minecraft.getInstance();
                  if (!iconSet) {
                      iconSet = true;
                      WindowIcon.apply(mc);
                      mc.getWindow().setTitle("Titania's Mod Loader");
                  }
                  if (!overlaySwapped && mc.getOverlay() instanceof LoadingOverlay lo) {
                      overlaySwapped = true;
                      mc.setOverlay(new TitanicLoadingOverlay(lo));
                  }
                  if (mc.getOverlay() == null && mc.screen instanceof TitleScreen) {
                      mc.setScreen(new TitleScreen());
                  }
              }

              @SubscribeEvent
              public static void onScreen(ScreenEvent.Opening event) {
                  if (event.getNewScreen() instanceof TitleScreen) {
                      if (!introShown) {
                          introShown = true;
                          event.setNewScreen(new TitanicIntroScreen());
                      } else {
                          event.setNewScreen(new TitaniaTitleScreen());
                      }
                  }
              }
          }
          EOF

          # ---- Java: window icon ----------------------------------------
          cat > src/main/java/com/titania/loader/WindowIcon.java <<'EOF'
          package com.titania.loader;

          import java.io.InputStream;
          import java.nio.ByteBuffer;
          import java.nio.IntBuffer;
          import net.minecraft.client.Minecraft;
          import org.lwjgl.glfw.GLFW;
          import org.lwjgl.glfw.GLFWImage;
          import org.lwjgl.stb.STBImage;
          import org.lwjgl.system.MemoryStack;
          import org.lwjgl.system.MemoryUtil;

          public final class WindowIcon {
              private WindowIcon() {}

              public static void apply(Minecraft mc) {
                  try (InputStream in = WindowIcon.class.getResourceAsStream("/assets/titanias_loader/icon.png")) {
                      if (in == null) return;
                      byte[] bytes = in.readAllBytes();
                      ByteBuffer file = MemoryUtil.memAlloc(bytes.length);
                      file.put(bytes);
                      file.flip();
                      try (MemoryStack st = MemoryStack.stackPush()) {
                          IntBuffer w = st.mallocInt(1);
                          IntBuffer h = st.mallocInt(1);
                          IntBuffer c = st.mallocInt(1);
                          ByteBuffer px = STBImage.stbi_load_from_memory(file, w, h, c, 4);
                          if (px != null) {
                              GLFWImage.Buffer icons = GLFWImage.malloc(1, st);
                              icons.position(0).width(w.get(0)).height(h.get(0)).pixels(px);
                              GLFW.glfwSetWindowIcon(mc.getWindow().getWindow(), icons);
                              STBImage.stbi_image_free(px);
                          }
                      } finally {
                          MemoryUtil.memFree(file);
                      }
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

          # ---- Java: the blocky 2D sinking-Titanic scene ----------------
          cat > src/main/java/com/titania/loader/ShipScene.java <<'EOF'
          package com.titania.loader;

          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.math.Axis;
          import net.minecraft.Util;
          import net.minecraft.client.gui.Font;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.network.chat.Component;

          public final class ShipScene {
              private ShipScene() {}

              /** p = sinking progress from 0 (afloat) to 1 (gone). */
              public static void draw(GuiGraphics g, int w, int h, float p) {
                  p = Math.max(0f, Math.min(1f, p));
                  g.fillGradient(0, 0, w, h, 0xFF02040F, 0xFF14284F);

                  for (int i = 0; i < 70; i++) {
                      int x = (i * 7919) % Math.max(1, w);
                      int y = (i * 104729) % Math.max(1, (int) (h * 0.55f));
                      int s = (i % 5 == 0) ? 3 : 2;
                      g.fill(x, y, x + s, y + s, 0xFFFFFFFF);
                  }
                  int moonSize = Math.max(10, h / 14);
                  int mx = (int) (w * 0.82f);
                  int my = (int) (h * 0.18f);
                  g.fill(mx, my, mx + moonSize, my + moonSize, 0xFFF4F1DE);

                  int water = (int) (h * 0.62f);
                  int u = Math.max(3, h / 48);
                  float tilt = Math.max(0f, Math.min(1f, (p - 0.12f) / 0.7f));
                  float sink = p * p * h * 0.6f;

                  PoseStack ps = g.pose();
                  ps.pushPose();
                  ps.translate(w / 2f, water - u * 2 + sink, 0f);
                  ps.mulPose(Axis.ZP.rotationDegrees(tilt * 78f));
                  ship(g, u);
                  ps.popPose();

                  // water drawn over the ship so it disappears beneath the surface
                  g.fill(0, water, w, h, 0xD0083A6E);
                  long ms = Util.getMillis();
                  for (int x = 0; x < w; x += u * 2) {
                      int wy = water + (int) (Math.sin((x + ms / 6.0) / (u * 3.0)) * u * 0.6);
                      g.fill(x, wy, x + u * 2, wy + u / 2 + 1, 0xFF2E7DB8);
                  }
                  if (p > 0.3f) {
                      int range = Math.max(1, h / 3);
                      for (int i = 0; i < 14; i++) {
                          int bx = w / 2 + ((i * 37) % (u * 40)) - u * 20;
                          int by = water + range - (int) ((ms / 12L + i * 41L) % range);
                          g.fill(bx, by, bx + 3, by + 3, 0xAAFFFFFF);
                      }
                  }
              }

              private static void ship(GuiGraphics g, int u) {
                  int BLACK = 0xFF141414, RED = 0xFF9E1B1B, WHITE = 0xFFEDEDED;
                  int BUFF = 0xFFD9A441, WIN = 0xFFFFE08A, GREY = 0xFF555555;
                  g.fill(-20 * u, -3 * u, 20 * u, 1 * u, BLACK);      // hull
                  g.fill(-20 * u, 1 * u, 19 * u, 2 * u, RED);         // red bottom
                  g.fill(20 * u, -3 * u, 21 * u, 0, BLACK);           // bow steps
                  g.fill(21 * u, -3 * u, 22 * u, -2 * u, BLACK);
                  g.fill(-21 * u, -3 * u, -20 * u, 2 * u, BLACK);     // stern
                  g.fill(-16 * u, -6 * u, 14 * u, -3 * u, WHITE);     // decks
                  g.fill(-12 * u, -8 * u, 8 * u, -6 * u, WHITE);
                  for (int x = -15; x < 13; x += 2) {
                      g.fill(x * u, -5 * u, x * u + u, -4 * u, WIN);  // windows
                  }
                  for (int k = 0; k < 4; k++) {                       // four funnels
                      int x = (-9 + k * 5) * u;
                      g.fill(x, -13 * u, x + 3 * u, -8 * u, BUFF);
                      g.fill(x, -13 * u, x + 3 * u, -12 * u, BLACK);
                  }
                  g.fill(15 * u, -11 * u, 16 * u, -3 * u, GREY);      // mast
              }

              public static void title(GuiGraphics g, Font font, int w, int h, String sub) {
                  PoseStack ps = g.pose();
                  ps.pushPose();
                  ps.scale(3f, 3f, 1f);
                  g.drawCenteredString(font, Component.literal("Titania's Mod Loader"), w / 6, h / 30, 0xFFFFFFFF);
                  ps.popPose();
                  if (sub != null) {
                      g.drawCenteredString(font, Component.literal(sub), w / 2, h - 24, 0xFFB8C7E0);
                  }
              }
          }
          EOF

          # ---- Java: loading screen (wraps the vanilla one) --------------
          cat > src/main/java/com/titania/loader/TitanicLoadingOverlay.java <<'EOF'
          package com.titania.loader;

          import net.minecraft.Util;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.screens.Overlay;

          public class TitanicLoadingOverlay extends Overlay {
              private final Overlay delegate;
              private final long start = Util.getMillis();

              public TitanicLoadingOverlay(Overlay delegate) {
                  this.delegate = delegate;
              }

              @Override
              public void render(GuiGraphics g, int mouseX, int mouseY, float partialTick) {
                  delegate.render(g, mouseX, mouseY, partialTick);
                  Minecraft mc = Minecraft.getInstance();
                  if (mc.getOverlay() != this) return; // vanilla overlay finished and removed us
                  float p = ((Util.getMillis() - start) % 9000L) / 9000f;
                  int w = g.guiWidth();
                  int h = g.guiHeight();
                  ShipScene.draw(g, w, h, p);
                  ShipScene.title(g, mc.font, w, h, "Loading mods...");
              }

              @Override
              public boolean isPauseScreen() {
                  return delegate.isPauseScreen();
              }
          }
          EOF

          # ---- Java: intro screen before the main menu -------------------
          cat > src/main/java/com/titania/loader/TitanicIntroScreen.java <<'EOF'
          package com.titania.loader;

          import net.minecraft.Util;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.gui.screens.TitleScreen;
          import net.minecraft.network.chat.Component;

          public class TitanicIntroScreen extends Screen {
              private static final float DURATION = 9f;
              private long start = -1L;
              private boolean done = false;

              public TitanicIntroScreen() {
                  super(Component.literal("Titanic"));
              }

              @Override
              public void render(GuiGraphics g, int mouseX, int mouseY, float partialTick) {
                  if (minecraft.getOverlay() != null) {
                      start = -1L; // wait until the loading screen is gone
                      g.fill(0, 0, width, height, 0xFF02040F);
                      return;
                  }
                  if (start < 0) start = Util.getMillis();
                  float t = (Util.getMillis() - start) / 1000f;
                  ShipScene.draw(g, width, height, t / DURATION);
                  ShipScene.title(g, font, width, height, "Click or press any key to skip");
                  if (t >= DURATION) finish();
              }

              private void finish() {
                  if (done) return;
                  done = true;
                  minecraft.setScreen(new TitaniaTitleScreen());
              }

              @Override
              public boolean keyPressed(int key, int scan, int mods) {
                  finish();
                  return true;
              }

              @Override
              public boolean mouseClicked(double x, double y, int button) {
                  finish();
                  return true;
              }

              @Override
              public boolean shouldCloseOnEsc() {
                  return false;
              }
          }
          EOF

          cat > src/main/java/com/titania/loader/LoadedMod.java <<'EOF'
          package com.titania.loader;

          public class LoadedMod {
              public final ModInfo info;
              public final boolean managed; // true = Titania loads it itself, false = another loader handles it
              public String status;
              public boolean failed;

              public LoadedMod(ModInfo info, boolean managed) {
                  this.info = info;
                  this.managed = managed;
                  if (managed) {
                      this.status = "Discovered";
                  } else if (info.loader() == ModInfo.Loader.FABRIC || info.loader() == ModInfo.Loader.QUILT) {
                      this.status = "Handled by the Connector layer";
                  } else {
                      this.status = "Loaded by NeoForge";
                  }
              }

              public void fail(String why) {
                  failed = true;
                  status = "Failed: " + why;
              }
          }
          EOF

          cat > src/main/java/com/titania/loader/MetadataReader.java <<'EOF'
          package com.titania.loader;

          import com.google.gson.JsonElement;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          /** Reads mod metadata from every supported format: Fabric, Quilt, Titania, NeoForge and Forge. */
          public final class MetadataReader {
              private MetadataReader() {}

              private interface Parser {
                  List<ModInfo> parse() throws Exception;
              }

              public static List<ModInfo> read(Path jar) {
                  List<ModInfo> out = new ArrayList<>();
                  try (ZipFile zf = new ZipFile(jar.toFile())) {
                      String fab = text(zf, "fabric.mod.json");
                      if (fab != null) tryAdd(out, jar, () -> List.of(fabric(fab, jar, ModInfo.Loader.FABRIC)));
                      String qui = text(zf, "quilt.mod.json");
                      if (qui != null) tryAdd(out, jar, () -> List.of(quilt(qui, jar)));
                      String tit = text(zf, "titania.mod.json");
                      if (tit != null) tryAdd(out, jar, () -> List.of(fabric(tit, jar, ModInfo.Loader.TITANIA)));
                      String neo = text(zf, "META-INF/neoforge.mods.toml");
                      if (neo != null) tryAdd(out, jar, () -> toml(neo, jar, ModInfo.Loader.NEOFORGE));
                      String frg = text(zf, "META-INF/mods.toml");
                      if (frg != null) tryAdd(out, jar, () -> toml(frg, jar, ModInfo.Loader.FORGE));
                  } catch (Exception e) {
                      TitaniaRuntime.LOG.warn("Titania: cannot open {}: {}", jar.getFileName(), e.toString());
                  }
                  return out;
              }

              private static void tryAdd(List<ModInfo> out, Path jar, Parser p) {
                  try {
                      out.addAll(p.parse());
                  } catch (Exception e) {
                      TitaniaRuntime.LOG.warn("Titania: bad metadata in {}: {}", jar.getFileName(), e.toString());
                  }
              }

              private static String text(ZipFile zf, String name) {
                  ZipEntry e = zf.getEntry(name);
                  if (e == null) return null;
                  try (InputStream in = zf.getInputStream(e)) {
                      return new String(in.readAllBytes(), StandardCharsets.UTF_8);
                  } catch (Exception ex) {
                      return null;
                  }
              }

              private static ModInfo fabric(String json, Path jar, ModInfo.Loader loader) {
                  JsonObject o = JsonParser.parseString(json).getAsJsonObject();
                  String id = o.get("id").getAsString();
                  List<ModInfo.Dep> deps = new ArrayList<>();
                  if (o.has("depends") && o.get("depends").isJsonObject()) {
                      for (Map.Entry<String, JsonElement> e : o.getAsJsonObject("depends").entrySet()) {
                          deps.add(new ModInfo.Dep(e.getKey(), true));
                      }
                  }
                  return new ModInfo(id, str(o, "name", id), str(o, "version", "?"), loader,
                          str(o, "description", ""), jar, deps, entrypoints(o.get("entrypoints")));
              }

              private static ModInfo quilt(String json, Path jar) {
                  JsonObject root = JsonParser.parseString(json).getAsJsonObject();
                  JsonObject q = root.getAsJsonObject("quilt_loader");
                  String id = q.get("id").getAsString();
                  JsonObject meta = q.has("metadata") && q.get("metadata").isJsonObject()
                          ? q.getAsJsonObject("metadata") : new JsonObject();
                  List<ModInfo.Dep> deps = new ArrayList<>();
                  if (q.has("depends") && q.get("depends").isJsonArray()) {
                      for (JsonElement el : q.getAsJsonArray("depends")) {
                          if (el.isJsonPrimitive()) {
                              deps.add(new ModInfo.Dep(el.getAsString(), true));
                          } else if (el.isJsonObject()) {
                              JsonObject d = el.getAsJsonObject();
                              if (!d.has("id")) continue;
                              boolean optional = d.has("optional") && d.get("optional").getAsBoolean();
                              deps.add(new ModInfo.Dep(d.get("id").getAsString(), !optional));
                          }
                      }
                  }
                  return new ModInfo(id, str(meta, "name", id), str(q, "version", "?"), ModInfo.Loader.QUILT,
                          str(meta, "description", ""), jar, deps, entrypoints(q.get("entrypoints")));
              }

              private static Map<String, List<String>> entrypoints(JsonElement el) {
                  Map<String, List<String>> m = new LinkedHashMap<>();
                  if (el == null || !el.isJsonObject()) return m;
                  for (Map.Entry<String, JsonElement> e : el.getAsJsonObject().entrySet()) {
                      List<String> list = new ArrayList<>();
                      collect(e.getValue(), list);
                      m.put(e.getKey(), list);
                  }
                  return m;
              }

              private static void collect(JsonElement v, List<String> list) {
                  if (v.isJsonPrimitive()) {
                      list.add(v.getAsString());
                  } else if (v.isJsonArray()) {
                      for (JsonElement x : v.getAsJsonArray()) collect(x, list);
                  } else if (v.isJsonObject() && v.getAsJsonObject().has("value")) {
                      list.add(v.getAsJsonObject().get("value").getAsString());
                  }
              }

              private static String str(JsonObject o, String key, String def) {
                  return o.has(key) && o.get(key).isJsonPrimitive() ? o.get(key).getAsString() : def;
              }

              /** Small purpose-built TOML reader: [[mods]] and [[dependencies.x]] tables only. */
              private static List<ModInfo> toml(String text, Path jar, ModInfo.Loader loader) {
                  List<Map<String, String>> mods = new ArrayList<>();
                  List<Map<String, String>> deps = new ArrayList<>();
                  Map<String, String> cur = null;
                  String[] lines = text.split("\\R");
                  for (int i = 0; i < lines.length; i++) {
                      String line = lines[i].trim();
                      if (line.isEmpty() || line.startsWith("#")) continue;
                      if (line.startsWith("[[")) {
                          String table = line.replace("[", "").replace("]", "").trim();
                          cur = new HashMap<>();
                          if (table.equals("mods")) {
                              mods.add(cur);
                          } else if (table.startsWith("dependencies.")) {
                              cur.put("owner", table.substring("dependencies.".length()));
                              deps.add(cur);
                          } else {
                              cur = null;
                          }
                          continue;
                      }
                      if (line.startsWith("[")) {
                          cur = null;
                          continue;
                      }
                      int eq = line.indexOf('=');
                      if (eq < 0) continue;
                      String key = line.substring(0, eq).trim();
                      String val = line.substring(eq + 1).trim();
                      String quote = val.startsWith("'''") ? "'''" : val.startsWith("\"\"\"") ? "\"\"\"" : null;
                      if (quote != null) {
                          StringBuilder sb = new StringBuilder(val.substring(3));
                          while (!sb.toString().contains(quote) && i + 1 < lines.length) {
                              sb.append('\n').append(lines[++i]);
                          }
                          int end = sb.indexOf(quote);
                          val = (end >= 0 ? sb.substring(0, end) : sb.toString()).trim();
                      } else if ((val.startsWith("\"") || val.startsWith("'")) && val.length() >= 2) {
                          char q = val.charAt(0);
                          int end = val.indexOf(q, 1);
                          val = end > 0 ? val.substring(1, end) : val.substring(1);
                      } else {
                          int hash = val.indexOf('#');
                          if (hash >= 0) val = val.substring(0, hash).trim();
                      }
                      if (cur != null) cur.put(key, val);
                  }

                  List<ModInfo> out = new ArrayList<>();
                  for (Map<String, String> m : mods) {
                      String id = m.get("modId");
                      if (id == null) continue;
                      List<ModInfo.Dep> d = new ArrayList<>();
                      for (Map<String, String> dm : deps) {
                          if (!id.equals(dm.get("owner")) || dm.get("modId") == null) continue;
                          String type = dm.get("type");
                          String mandatory = dm.get("mandatory");
                          boolean required = type != null ? type.equals("required")
                                  : (mandatory == null || mandatory.equals("true"));
                          d.add(new ModInfo.Dep(dm.get("modId"), required));
                      }
                      out.add(new ModInfo(id, m.getOrDefault("displayName", id), m.getOrDefault("version", "?"),
                              loader, m.getOrDefault("description", ""), jar, d, new LinkedHashMap<>()));
                  }
                  return out;
              }
          }
