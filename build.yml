          package com.titania.loader;

          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.math.Axis;
          import java.util.Random;
          import net.minecraft.Util;
          import net.minecraft.client.gui.GuiGraphics;

          /**
           * Looping 2D side-view animation: three lanes of randomly chosen ships (7 kinds), each cycling through
           * sailing in, floating, sinking completely, and leaving bubbles and debris. Ships are pre-painted sprites.
           */
          public final class SeaBackground {
              private SeaBackground() {}

              private static final float T = 36f; // seconds per ship cycle
              private static final float[] OFFSET = {0f, 12f, 24f};
              private static final float[] LANE_Y = {0.50f, 0.61f, 0.74f};
              private static final float[] LANE_X = {0.27f, 0.70f, 0.46f};
              private static final float[] LANE_DIV = {70f, 52f, 40f};
              private static final int[] WATER = {0xF0081F45, 0xF00B2E5E, 0xF00F3F7A};
              private static final int SEED = new Random().nextInt(100000);

              private static int hash(int a, int b) {
                  int x = a * 0x9E3779B1 ^ b * 0x85EBCA6B ^ SEED * 0xC2B2AE35;
                  x ^= x >>> 15;
                  x *= 0x2C1B3C6D;
                  x ^= x >>> 12;
                  return x;
              }

              /** Main menu: runs on real time. */
              public static void draw(GuiGraphics g, int w, int h) {
                  draw(g, w, h, Util.getMillis() / 1000f + 5f);
              }

              /** time = seconds into the animation. */
              public static void draw(GuiGraphics g, int w, int h, float time) {
                  Sprites.ensure();
                  Sprites.drawSky(g, w, h);
                  for (int lane = 0; lane < 3; lane++) lane(g, w, h, lane, time);
              }

              private static void lane(GuiGraphics g, int w, int h, int lane, float time) {
                  int y = (int) (h * LANE_Y[lane]);
                  int u = Math.max(2, (int) (h / LANE_DIV[lane]));
                  float local = time + OFFSET[lane];
                  int cycle = (int) Math.floor(local / T);
                  float s = local - cycle * T;

                  int hs = hash(cycle, lane);
                  int kind = Math.floorMod(hs >>> 4, Sprites.KINDS);
                  int face = (hs & 1) == 0 ? 1 : -1;
                  int bowDown = (kind == 0 || kind == 6) ? 1 : (((hs >>> 9) & 1) == 0 ? 1 : -1);
                  float scale = Math.min(1f, 46f / Sprites.LEN[kind]);

                  float e = Math.min(1f, s / 6f);
                  e = e * e * (3 - 2 * e);
                  float baseX = w * LANE_X[lane];
                  float x = baseX - face * w * 0.8f * (1 - e);
                  float q = Math.max(0f, Math.min(1f, (s - 10f) / 16f));
                  float bob = (float) Math.sin(time * 1.7 + lane) * u * 0.4f;
                  float tilt = Math.min(1f, q * 1.6f) * (kind == 0 || kind == 6 ? 78f : 62f);
                  float depth = q * q * u * 70f;

                  if (s < 28f) {
                      PoseStack ps = g.pose();
                      ps.pushPose();
                      ps.translate(x + face * q * u * 8f, y - u * 2f + bob * (1f - q) + depth, 0f);
                      ps.mulPose(Axis.ZP.rotationDegrees(face * bowDown * tilt));
                      ps.scale(face * scale, scale, 1f);
                      Sprites.drawShip(g, kind, u);
                      ps.popPose();
                  }

                  // water layer hides whatever has sunk below this lane's surface
                  g.fill(0, y, w, h, WATER[lane]);
                  Sprites.drawWaves(g, w, y, u, lane);

                  float endX = baseX + face * u * 8f;
                  if (s > 12f && s < 26f) { // bubbles
                      int size = Math.max(2, u / 2);
                      for (int i = 0; i < 8; i++) {
                          int bx = (int) (endX + ((i * 37) % (u * 20)) - u * 10);
                          int by = y + u * 12 - (int) (((s * 8f + i * 13) % 12f) * u);
                          g.fill(bx, by, bx + size, by + size, 0x90FFFFFF);
                      }
                  }
                  if (s > 14f && s < 33f) { // floating debris
                      int a = (int) (255 * Math.min(1f, (33f - s) / 4f));
                      for (int i = 0; i < 6; i++) {
                          int dx = (i - 3) * u * 4 + (int) (Math.sin(time * 0.8 + i) * u)
                                  + (int) ((s - 14f) * u * 0.3f * (i % 2 == 0 ? 1 : -1));
                          int px = (int) endX + dx;
                          g.fill(px, y - u / 2, px + u * 2, y, (a << 24) | 0x7A5230);
                      }
                  }
              }
          }
