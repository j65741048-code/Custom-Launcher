          cat > src/main/java/com/titania/loader/Sprites.java <<'EOF'
          package com.titania.loader;

          import com.mojang.blaze3d.platform.NativeImage;
          import java.util.Random;
          import net.minecraft.Util;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.renderer.texture.DynamicTexture;
          import net.minecraft.client.renderer.texture.TextureManager;
          import net.minecraft.resources.ResourceLocation;

          /**
           * All ship, sky and wave art is painted ONCE into small textures, then drawn with a single
           * image draw each. This replaces thousands of per-frame rectangle fills and removes the lag.
           */
          public final class Sprites {
              private Sprites() {}

              public static final int KINDS = 7;
              /** 0 Titanic-style liner, 1 galleon, 2 freighter, 3 trawler, 4 1800s steamship, 5 modern cruise ship, 6 five-funnel liner */
              public static final int[] LEN = {44, 36, 46, 22, 38, 60, 64};
              private static final int[][] DIMS = {{24, 14, 3}, {20, 24, 3}, {25, 13, 3}, {13, 11, 3}, {20, 20, 3}, {31, 22, 3}, {34, 17, 3}};
              private static final int[] WAVE_COLOR = {0xFF1B4A8A, 0xFF2563A3, 0xFF3A84C4};
              private static final int SKY_W = 640;
              private static final int SKY_H = 360;

              private static final DynamicTexture[] SHIPS = new DynamicTexture[KINDS];
              private static final int[] SW = new int[KINDS];
              private static final int[] SH = new int[KINDS];
              private static final int[] SOX = new int[KINDS];
              private static final int[] SOY = new int[KINDS];
              private static final ResourceLocation[] SHIP_LOC = new ResourceLocation[KINDS];
              private static final DynamicTexture[] WAVES = new DynamicTexture[3];
              private static final ResourceLocation[] WAVE_LOC = new ResourceLocation[3];
              private static DynamicTexture sky;
              private static final ResourceLocation SKY_LOC = loc("dyn/sky");

              static {
                  for (int i = 0; i < KINDS; i++) SHIP_LOC[i] = loc("dyn/ship" + i);
                  for (int i = 0; i < 3; i++) WAVE_LOC[i] = loc("dyn/wave" + i);
              }

              private static ResourceLocation loc(String path) {
                  return ResourceLocation.fromNamespaceAndPath("titanias_loader", path);
              }

              private static boolean dead(DynamicTexture t) {
                  return t == null || t.getPixels() == null;
              }

              /** Builds any missing texture (also rebuilds if a resource reload closed one). Call on the render thread. */
              public static void ensure() {
                  TextureManager tm = Minecraft.getInstance().getTextureManager();
                  for (int k = 0; k < KINDS; k++) {
                      if (dead(SHIPS[k])) {
                          Px p = paint(k);
                          SHIPS[k] = p.texture();
                          SW[k] = p.w;
                          SH[k] = p.h;
                          SOX[k] = p.ox;
                          SOY[k] = p.oy;
                          tm.register(SHIP_LOC[k], SHIPS[k]);
                      }
                  }
                  if (dead(sky)) {
                      sky = makeSky();
                      tm.register(SKY_LOC, sky);
                  }
                  for (int l = 0; l < 3; l++) {
                      if (dead(WAVES[l])) {
                          WAVES[l] = makeWave(WAVE_COLOR[l]);
                          tm.register(WAVE_LOC[l], WAVES[l]);
                      }
                  }
              }

              public static void drawSky(GuiGraphics g, int w, int h) {
                  g.blit(SKY_LOC, 0, 0, w, h, 0f, 0f, SKY_W, SKY_H, SKY_W, SKY_H);
              }

              /** Draws a ship with its pivot (centre, waterline) at the current origin; u = screen pixels per sprite pixel. */
              public static void drawShip(GuiGraphics g, int kind, int u) {
                  g.blit(SHIP_LOC[kind], -SOX[kind] * u, -SOY[kind] * u, SW[kind] * u, SH[kind] * u,
                          0f, 0f, SW[kind], SH[kind], SW[kind], SH[kind]);
              }

              public static void drawWaves(GuiGraphics g, int w, int y, int u, int lane) {
                  int ws = Math.max(2, u / 2);
                  int tw = 128 * ws;
                  int off = (int) ((Util.getMillis() * 0.03f * ws + lane * 400) % tw);
                  for (int x = -off; x < w; x += tw) {
                      g.blit(WAVE_LOC[lane], x, y - ws * 2, tw, 4 * ws, 0f, 0f, 128, 4, 128, 4);
                  }
              }

              // ---------------------------------------------------------------- painting

              private static final class Px {
                  final int w, h, ox, oy;
                  final int[] a;

                  Px(int halfW, int up, int down) {
                      w = halfW * 2;
                      h = up + down;
                      ox = halfW;
                      oy = up;
                      a = new int[w * h];
                  }

                  void rect(int x0, int y0, int x1, int y1, int c) {
                      for (int y = y0; y < y1; y++) {
                          for (int x = x0; x < x1; x++) {
                              int px = x + ox, py = y + oy;
                              if (px >= 0 && px < w && py >= 0 && py < h) a[py * w + px] = c;
                          }
                      }
                  }

                  /** Like rect, but every pixel is slightly lighter or darker so flat colour reads as a blocky texture. */
                  void block(int x0, int y0, int x1, int y1, int c, int seed) {
                      for (int y = y0; y < y1; y++) {
                          for (int x = x0; x < x1; x++) {
                              int px = x + ox, py = y + oy;
                              if (px < 0 || px >= w || py < 0 || py >= h) continue;
                              int hsh = (x * 73856093) ^ (y * 19349663) ^ (seed * 83492791);
                              int d = (((hsh >>> 8) & 15) - 8) * 2;
                              a[py * w + px] = shade(c, d);
                          }
                      }
                  }

                  DynamicTexture texture() {
                      NativeImage img = new NativeImage(NativeImage.Format.RGBA, w, h, true);
                      for (int y = 0; y < h; y++) {
                          for (int x = 0; x < w; x++) img.setPixelRGBA(x, y, abgr(a[y * w + x]));
                      }
                      DynamicTexture t = new DynamicTexture(img);
                      t.setFilter(false, false);
                      return t;
                  }
              }

              private static int abgr(int c) {
                  return (c & 0xFF00FF00) | ((c >> 16) & 0xFF) | ((c & 0xFF) << 16);
              }

              private static int shade(int c, int d) {
                  int r = clamp(((c >> 16) & 255) + d);
                  int g = clamp(((c >> 8) & 255) + d);
                  int b = clamp((c & 255) + d);
                  return 0xFF000000 | (r << 16) | (g << 8) | b;
              }

              private static int clamp(int v) {
                  return Math.max(0, Math.min(255, v));
              }

              private static DynamicTexture makeSky() {
                  NativeImage img = new NativeImage(NativeImage.Format.RGBA, SKY_W, SKY_H, true);
                  for (int y = 0; y < SKY_H; y++) {
                      float t = y / (float) (SKY_H - 1);
                      int c = 0xFF000000 | ((int) (5 + 25 * t) << 16) | ((int) (11 + 47 * t) << 8) | (int) (34 + 73 * t);
                      for (int x = 0; x < SKY_W; x++) img.setPixelRGBA(x, y, abgr(c));
                  }
                  Random rnd = new Random(7);
                  for (int i = 0; i < 170; i++) {
                      int x = rnd.nextInt(SKY_W - 2), y = rnd.nextInt((int) (SKY_H * 0.55f));
                      int b = 150 + rnd.nextInt(105);
                      int c = 0xFF000000 | (b << 16) | (b << 8) | b;
                      int size = i % 6 == 0 ? 2 : 1;
                      for (int dy = 0; dy < size; dy++) for (int dx = 0; dx < size; dx++) img.setPixelRGBA(x + dx, y + dy, abgr(c));
                  }
                  for (int y = 0; y < 22; y++) {
                      for (int x = 0; x < 22; x++) {
                          int c = ((x * 7 + y * 13) % 11 == 0) ? 0xFFD9D5BE : 0xFFF4F1DE;
                          img.setPixelRGBA(540 + x, 36 + y, abgr(c));
                      }
                  }
                  DynamicTexture t = new DynamicTexture(img);
                  t.setFilter(false, false);
                  return t;
              }

              private static DynamicTexture makeWave(int color) {
                  NativeImage img = new NativeImage(NativeImage.Format.RGBA, 128, 4, true);
                  for (int x = 0; x < 128; x++) {
                      int yc = (int) Math.round(1.0 + Math.sin(x * Math.PI * 2 / 64.0));
                      img.setPixelRGBA(x, yc, abgr(color));
                      if (yc + 1 < 4) img.setPixelRGBA(x, yc + 1, abgr(shade(color, -25)));
                  }
                  DynamicTexture t = new DynamicTexture(img);
                  t.setFilter(false, false);
                  return t;
              }

              private static Px paint(int kind) {
                  int[] d = DIMS[kind];
                  Px p = new Px(d[0], d[1], d[2]);
                  switch (kind) {
                      case 0 -> liner4(p);
                      case 1 -> galleon(p);
                      case 2 -> freighter(p);
                      case 3 -> trawler(p);
                      case 4 -> steamship1800s(p);
                      case 5 -> cruiseShip(p);
                      default -> liner5(p);
                  }
                  return p;
              }

              private static void liner4(Px p) {
                  p.block(-20, -3, 20, 1, 0xFF1A1A1A, 1);
                  p.block(-20, 1, 19, 2, 0xFF9E1B1B, 2);
                  p.rect(20, -3, 21, 0, 0xFF1A1A1A);
                  p.rect(21, -3, 22, -2, 0xFF1A1A1A);
                  p.block(-16, -6, 14, -3, 0xFFEDEDED, 3);
                  p.block(-12, -8, 8, -6, 0xFFEDEDED, 4);
                  for (int x = -15; x < 13; x += 2) p.rect(x, -5, x + 1, -4, 0xFFFFE08A);
                  for (int k = 0; k < 4; k++) {
                      int x = -9 + k * 5;
                      p.block(x, -13, x + 3, -8, 0xFFD9A441, 5 + k);
                      p.rect(x, -13, x + 3, -12, 0xFF141414);
                  }
                  p.rect(15, -11, 16, -3, 0xFF555555);
              }

              private static void galleon(Px p) {
                  p.block(-14, -3, 14, 2, 0xFF6B4423, 1);
                  p.block(-14, -6, -8, -3, 0xFF7A5230, 2);
                  p.rect(14, -3, 18, -2, 0xFF4A2F18);
                  p.block(-9, -19, 0, -8, 0xFFE8DFC0, 3);
                  p.block(1, -17, 9, -8, 0xFFE8DFC0, 4);
                  p.rect(-4, -21, -3, -3, 0xFF3B2512);
                  p.rect(5, -19, 6, -3, 0xFF3B2512);
                  p.rect(-4, -23, -1, -21, 0xFFB22222);
                  for (int x = -12; x < 12; x += 3) p.rect(x, -1, x + 1, 0, 0xFF1E1208);
              }

              private static void freighter(Px p) {
                  p.block(-22, -3, 22, 2, 0xFF2C4A3A, 1);
                  p.block(-22, 1, 21, 2, 0xFF7B2A2A, 2);
                  p.rect(22, -3, 23, 0, 0xFF2C4A3A);
                  p.block(-20, -9, -12, -3, 0xFFEFEFEF, 3);
                  p.rect(-19, -7, -13, -6, 0xFF2A3F5F);
                  p.rect(-17, -12, -14, -9, 0xFFC23B22);
                  int[] cols = {0xFFC0392B, 0xFF2980B9, 0xFFD68910, 0xFF27AE60};
                  for (int i = 0; i < 6; i++) {
                      int x = -10 + i * 5;
                      p.block(x, -6, x + 4, -3, cols[i % 4], 3 + i);
                      if (i < 4) p.block(x, -9, x + 4, -6, cols[(i + 2) % 4], 9 + i);
                  }
              }

              private static void trawler(Px p) {
                  p.block(-10, -2, 10, 2, 0xFF2F5D8A, 1);
                  p.rect(10, -2, 11, 0, 0xFF2F5D8A);
                  p.block(-6, -6, 0, -2, 0xFFF2F2F2, 2);
                  p.rect(-5, -5, -1, -4, 0xFF223344);
                  p.rect(3, -10, 4, -2, 0xFF555555);
                  p.rect(3, -9, 9, -8, 0xFF555555);
              }

              /** 1800s steamship: wooden hull, paddle-wheel box, tall funnel with smoke, and auxiliary sails. */
              private static void steamship1800s(Px p) {
                  p.block(-17, -2, 17, 2, 0xFF2B2118, 1);
                  p.rect(-17, -3, 17, -2, 0xFF7A5230);
                  p.rect(17, -3, 20, -2, 0xFF7A5230);
                  p.rect(17, -2, 19, 0, 0xFF2B2118);
                  p.rect(-17, 0, 17, 1, 0xFFE8E0C8);
                  p.block(-6, -6, 7, -3, 0xFFD9CDB0, 2);
                  for (int x = -5; x < 6; x += 3) p.rect(x, -5, x + 2, -4, 0xFF3A4A5A);
                  p.block(-10, -7, -4, -1, 0xFF8B2E2E, 3);
                  for (int i = 0; i < 3; i++) p.rect(-9 + i * 2, -6, -8 + i * 2, -2, 0xFF5A1D1D);
                  p.block(-2, -14, 2, -6, 0xFF1A1A1A, 4);
                  p.rect(-2, -10, 2, -9, 0xFF9E1B1B);
                  p.rect(-1, -17, 2, -14, 0xFF777777);
                  p.rect(1, -19, 4, -16, 0xFF999999);
                  p.rect(3, -20, 6, -18, 0xFFAAAAAA);
                  p.rect(-13, -17, -12, -3, 0xFF3B2512);
                  p.rect(11, -16, 12, -3, 0xFF3B2512);
                  p.block(-12, -16, -6, -8, 0xFFE8DFC0, 5);
                  p.block(12, -15, 17, -6, 0xFFE8DFC0, 6);
              }

              /** Modern cruise ship: stacked white decks with rows of cabin windows, blue hull stripe, one funnel. */
              private static void cruiseShip(Px p) {
                  p.block(-28, -3, 29, 1, 0xFFF2F2F2, 1);
                  p.rect(-28, 1, 28, 2, 0xFF1B3A6B);
                  p.rect(29, -3, 30, -1, 0xFFF2F2F2);
                  for (int i = 0; i < 6; i++) {
                      int y1 = -3 - i * 2;
                      int x0 = -26 + i * 2;
                      int x1 = 26 - i * 3;
                      p.block(x0, y1 - 2, x1, y1, i % 2 == 0 ? 0xFFF8F8F8 : 0xFFE4EAF0, 10 + i);
                      p.rect(x0, y1 - 2, x1, y1 - 1, 0xFFBFD3E6);
                      for (int x = x0 + 1; x < x1 - 1; x += 2) p.rect(x, y1 - 1, x + 1, y1, 0xFF2A4A7A);
                  }
                  p.block(-8, -20, -3, -15, 0xFFF2F2F2, 30);
                  p.rect(-8, -20, -3, -19, 0xFF1B3A6B);
                  p.rect(-8, -17, -3, -16, 0xFF1B3A6B);
                  p.rect(10, -20, 11, -15, 0xFF888888);
              }

              /** Ocean liner with five funnels. */
              private static void liner5(Px p) {
                  p.block(-30, -3, 30, 1, 0xFF141414, 1);
                  p.rect(-30, 1, 29, 2, 0xFF9E1B1B);
                  p.rect(30, -3, 31, 0, 0xFF141414);
                  p.rect(31, -3, 32, -2, 0xFF141414);
                  p.rect(-31, -3, -30, 2, 0xFF141414);
                  p.block(-26, -6, 24, -3, 0xFFEDEDED, 2);
                  p.block(-20, -9, 16, -6, 0xFFEDEDED, 3);
                  for (int x = -25; x < 23; x += 2) p.rect(x, -5, x + 1, -4, 0xFFFFE08A);
                  for (int k = 0; k < 5; k++) {
                      int x = -17 + k * 7;
                      p.block(x, -15, x + 4, -9, 0xFFD9A441, 5 + k);
                      p.rect(x, -15, x + 4, -14, 0xFF141414);
                  }
                  p.rect(26, -13, 27, -3, 0xFF555555);
                  p.rect(-28, -11, -27, -3, 0xFF555555);
              }
          }
          EOF

      # ------------------------------------------------------------------
      # 2. Build the loader jar
      # ------------------------------------------------------------------
      - name: Build
        run: gradle build --no-daemon

      # ------------------------------------------------------------------
      # 3. Fetch compatibility + performance mods from Modrinth
      # ------------------------------------------------------------------
      - name: Download bundled mods
        run: |
          mkdir -p pack/mods
          cp build/libs/titanias-mod-loader-*.jar pack/mods/
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          MC = "1.21.1"
          # Fabric-mod support layer + Fabric API port, then FPS/stability mods
          SLUGS = [
              "connector",              # Sinytra Connector: runs Fabric mods on NeoForge
              "forgified-fabric-api",   # Fabric API for Connector
              "embeddium",              # faster rendering (Sodium port)
              "modernfix",              # memory + load time + stutter fixes
              "ferrite-core",           # lower memory use, fewer GC spikes
              "immediatelyfast",        # faster immediate-mode rendering / GUI
          ]

          for slug in SLUGS:
              q = urllib.parse.urlencode({
                  "loaders": json.dumps(["neoforge"]),
                  "game_versions": json.dumps([MC]),
              })
              req = urllib.request.Request(
                  f"https://api.modrinth.com/v2/project/{slug}/version?{q}",
                  headers={"User-Agent": "titanias-mod-loader-build"},
              )
              versions = json.load(urllib.request.urlopen(req))
              if not versions:
                  print(f"::warning::No NeoForge {MC} build found for {slug}")
                  continue
              v = next((x for x in versions if x["version_type"] == "release"), versions[0])
              f = next((x for x in v["files"] if x.get("primary")), v["files"][0])
              dest = os.path.join("pack", "mods", f["filename"])
              urllib.request.urlretrieve(f["url"], dest)
              print("downloaded", f["filename"])
          PY

      # ------------------------------------------------------------------
      # 4. Package a ready-to-use instance
      # ------------------------------------------------------------------
      - name: Package instance
        run: |
          cat > pack/options.txt <<'EOF'
          enableVsync:true
          maxFps:120
          renderDistance:12
          simulationDistance:8
          entityDistanceScaling:1.0
          biomeBlendRadius:2
          mipmapLevels:2
          EOF

          cat > pack/jvm-args.txt <<'EOF'
          -Xms4G
          -Xmx4G
          -XX:+UseZGC
          -XX:+ZGenerational
          -XX:+AlwaysPreTouch
          -XX:+DisableExplicitGC
          EOF

          cat > pack/README.txt <<'EOF'
          Titania's Mod Loader (Minecraft 1.21.1, NeoForge)

          1. Install NeoForge 21.1.x for Minecraft 1.21.1 and create a profile with it.
          2. Copy the "mods" folder (and optionally options.txt) into that profile's game folder.
          3. Use the arguments in jvm-args.txt as the profile's JVM arguments (Java 21).
          4. NeoForge mods go in mods/. Fabric, Quilt and Titania mods go in titania_mods/ (created on first launch).
          5. Main menu > Mods shows every mod from every loader, with its load status.
          6. Loading screens (startup, joining a world, loading terrain) use the sinking-ships animation.

          Built in: Sinytra Connector + Forgified Fabric API (Fabric mod support),
          Embeddium, ModernFix, FerriteCore, ImmediatelyFast (stable FPS).
          EOF

          cd pack
          zip -r ../Titanias-Mod-Loader-1.21.1.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Titanias-Mod-Loader-1.21.1
          path: Titanias-Mod-Loader-1.21.1.zip
