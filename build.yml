          cat > src/main/java/com/titania/loader/TitaniaRuntime.java <<'EOF'
          package com.titania.loader;

          import com.mojang.logging.LogUtils;
          import java.io.IOException;
          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;
          import java.net.URL;
          import java.net.URLClassLoader;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;
          import net.neoforged.fml.loading.FMLPaths;
          import org.slf4j.Logger;

          /**
           * The Titania loader core.
           *  - discovers mods (titania_mods/ = loaded by Titania, mods/ = observed for the unified list)
           *  - reads Fabric, Quilt, Titania, NeoForge and Forge metadata
           *  - resolves dependencies and orders the load
           *  - loads each Titania-managed mod through its own class loader and runs its entrypoints
           */
          public final class TitaniaRuntime {
              private TitaniaRuntime() {}

              public static final Logger LOG = LogUtils.getLogger();
              private static final List<LoadedMod> MODS = new ArrayList<>();
              private static URLClassLoader modLoader;

              public static List<LoadedMod> mods() {
                  return MODS;
              }

              public static void discover() {
                  MODS.clear();
                  Path game = FMLPaths.GAMEDIR.get();
                  Path managedDir = game.resolve("titania_mods");
                  try {
                      Files.createDirectories(managedDir);
                  } catch (IOException ignored) {
                  }
                  MODS.addAll(ModDiscovery.scan(managedDir, true));
                  MODS.addAll(ModDiscovery.scan(game.resolve("mods"), false));
                  LOG.info("Titania: discovered {} mods ({} managed by Titania)", MODS.size(),
                          MODS.stream().filter(m -> m.managed).count());
              }

              public static void initialize() {
                  for (LoadedMod m : MODS) {
                      if (m.managed && (m.info.loader() == ModInfo.Loader.NEOFORGE || m.info.loader() == ModInfo.Loader.FORGE)) {
                          m.fail("NeoForge/Forge mods belong in the normal mods folder");
                      }
                  }
                  List<LoadedMod> order = ModResolver.resolve(MODS);
                  URL[] urls = order.stream().map(m -> url(m.info.path())).toArray(URL[]::new);
                  modLoader = new URLClassLoader("titania-mods", urls, TitaniaRuntime.class.getClassLoader());

                  for (LoadedMod m : order) {
                      List<String> keys = switch (m.info.loader()) {
                          case FABRIC -> List.of("main", "client");
                          case QUILT -> List.of("init", "client_init");
                          case TITANIA -> List.of("titania");
                          default -> List.of();
                      };
                      int ran = 0;
                      try {
                          for (String key : keys) {
                              for (String spec : m.info.entrypoints().getOrDefault(key, List.of())) {
                                  run(modLoader, spec, key);
                                  ran++;
                              }
                          }
                          m.status = ran > 0 ? "Loaded by Titania (" + ran + " entrypoint" + (ran == 1 ? "" : "s") + ")"
                                  : "Loaded by Titania (no entrypoints)";
                          LOG.info("Titania: loaded {} {}", m.info.id(), m.info.version());
                      } catch (Throwable t) {
                          Throwable root = t.getCause() != null ? t.getCause() : t;
                          m.fail(root.getClass().getSimpleName() + ": " + root.getMessage());
                          LOG.error("Titania: failed to load {}", m.info.id(), t);
                      }
                  }
              }

              private static URL url(Path p) {
                  try {
                      return p.toUri().toURL();
                  } catch (Exception e) {
                      throw new IllegalStateException(e);
                  }
              }

              private static void run(ClassLoader cl, String spec, String key) throws Exception {
                  String clsName = spec;
                  String member = null;
                  int i = spec.indexOf("::");
                  if (i > 0) {
                      clsName = spec.substring(0, i);
                      member = spec.substring(i + 2);
                  }
                  Class<?> c = Class.forName(clsName, true, cl);
                  if (member != null) {
                      Method m = c.getMethod(member);
                      Object target = Modifier.isStatic(m.getModifiers()) ? null : c.getDeclaredConstructor().newInstance();
                      m.invoke(target);
                      return;
                  }
                  Object inst = c.getDeclaredConstructor().newInstance();
                  if (inst instanceof TitaniaMod t) {
                      t.onInitialize();
                      return;
                  }
                  String name = key.equals("client") || key.equals("client_init") ? "onInitializeClient" : "onInitialize";
                  for (Method m : c.getMethods()) {
                      if (m.getName().equals(name)) {
                          m.invoke(inst, new Object[m.getParameterCount()]);
                          return;
                      }
                  }
              }
          }
