          package com.titania.loader;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          /** Checks required dependencies and produces a dependency-ordered load list. */
          public final class ModResolver {
              private ModResolver() {}

              private static final Set<String> BUILTIN = Set.of(
                      "minecraft", "java", "fabricloader", "fabric-loader", "quilt_loader", "neoforge", "forge",
                      "fml", "javafml", "titanias_loader", "fabric", "fabric-api", "quilted_fabric_api", "qsl");

              static String norm(String id) {
                  int i = id.indexOf(':');
                  return i >= 0 ? id.substring(i + 1) : id;
              }

              private static boolean builtin(String id) {
                  return BUILTIN.contains(id) || id.startsWith("fabric-");
              }

              public static List<LoadedMod> resolve(List<LoadedMod> all) {
                  Map<String, LoadedMod> byId = new HashMap<>();
                  for (LoadedMod m : all) byId.putIfAbsent(m.info.id(), m);

                  boolean changed = true;
                  while (changed) {
                      changed = false;
                      for (LoadedMod m : all) {
                          if (!m.managed || m.failed) continue;
                          for (ModInfo.Dep d : m.info.deps()) {
                              if (!d.required()) continue;
                              String id = norm(d.id());
                              if (builtin(id)) continue;
                              LoadedMod dep = byId.get(id);
                              if (dep == null || dep.failed) {
                                  m.fail("missing required dependency '" + id + "'");
                                  changed = true;
                                  break;
                              }
                          }
                      }
                  }

                  List<LoadedMod> order = new ArrayList<>();
                  Set<LoadedMod> done = new HashSet<>();
                  Set<LoadedMod> visiting = new HashSet<>();
                  for (LoadedMod m : all) {
                      if (m.managed && !m.failed) visit(m, byId, order, done, visiting);
                  }
                  return order;
              }

              private static void visit(LoadedMod m, Map<String, LoadedMod> byId, List<LoadedMod> order,
                                        Set<LoadedMod> done, Set<LoadedMod> visiting) {
                  if (done.contains(m)) return;
                  if (!visiting.add(m)) {
                      m.fail("dependency cycle");
                      return;
                  }
                  for (ModInfo.Dep d : m.info.deps()) {
                      LoadedMod dep = byId.get(norm(d.id()));
                      if (dep != null && dep.managed && !dep.failed) visit(dep, byId, order, done, visiting);
                  }
                  visiting.remove(m);
                  done.add(m);
                  if (!m.failed) order.add(m);
              }
          }
